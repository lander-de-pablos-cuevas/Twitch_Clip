<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Twitch</title>
  <meta property="og:title" content="Twitch - Clip en directo">
  <meta property="og:description" content="Mira el directo y los mejores momentos de la comunidad.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://static-cdn.jtvnw.net/ttv-static/404_preview-1280x720.jpg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e0e10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #fake-twitch {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #0e0e10;
      z-index: 1;
    }
    header {
      height: 50px;
      background: #18181b;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #26262c;
    }
    .twitch-logo {
      color: #bf94ff;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
    }
    .placeholder {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Overlay de cookies realista */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
    }
    .cookie-box {
      background: #18181b;
      border: 1px solid #303038;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: left;
      color: #efeff1;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
      pointer-events: auto;
    }
    .cookie-box h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }
    .cookie-box p {
      font-size: 13px;
      line-height: 1.5;
      color: #adadb8;
      margin-bottom: 20px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-accept {
      flex: 1;
      padding: 12px 16px;
      background: #9146ff;
      color: white;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .btn-decline {
      padding: 12px 16px;
      background: #26262c;
      color: #efeff1;
      font-weight: 600;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Screamer a pantalla completa */
    #screamer-container {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 999999;
      overflow: hidden;
    }
    #screamer-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .shake {
      animation: crazyShake 0.04s infinite;
    }
    @keyframes crazyShake {
      0% { transform: translate(5px, -4px) scale(1.05) contrast(150%); }
      25% { transform: translate(-5px, 5px) scale(1.08) contrast(190%); }
      50% { transform: translate(5px, 5px) scale(1.03) contrast(160%); }
      75% { transform: translate(-4px, -5px) scale(1.06) contrast(200%); }
      100% { transform: translate(4px, -3px) scale(1.05) contrast(150%); }
    }
  </style>
</head>

        <button class="btn-accept" id="btn-accept">Aceptar cookies</button>

  </div>

  <script>
    const overlay = document.getElementById('modal-overlay');
    const screamerBox = document.getElementById('screamer-container');
    const video = document.getElementById('screamer-video');
    const btnAccept = document.getElementById('btn-accept');
    const btnDecline = document.getElementById('btn-decline');

    let triggered = false;

    function triggerScreamer() {
      if (triggered) return;
      triggered = true;

      // 1. Mostrar vídeo y activar sacudida
      overlay.style.display = 'none';
      screamerBox.style.display = 'block';
      screamerBox.classList.add('shake');

      // 2. Audio boost con Web Audio API
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          const source = ctx.createMediaElementSource(video);
          const gainNode = ctx.createGain();
          gainNode.gain.setValueAtTime(10.0, ctx.currentTime);
          source.connect(gainNode);
          gainNode.connect(ctx.destination);
        }
      } catch (err) {
        console.warn('AudioContext error:', err);
      }

      // 3. Reproducir vídeo
      video.muted = false;
      video.volume = 1.0;
      video.currentTime = 0;
      video.play().catch(e => console.warn('Play error:', e));

      // 4. Intentar pantalla completa sin bloquear si falla
      try {
        const el = document.documentElement;
        const reqFS = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (reqFS) {
          reqFS.call(el).catch(() => {});
        }
      } catch (e) {}
    }

    // Activadores múltiples para asegurar respuesta en cualquier toque en móvil o PC
    btnAccept.addEventListener('click', triggerScreamer);
    btnDecline.addEventListener('click', triggerScreamer);
    overlay.addEventListener('click', triggerScreamer);
    btnAccept.addEventListener('touchend', triggerScreamer);
    btnDecline.addEventListener('touchend', triggerScreamer);
    overlay.addEventListener('touchend', triggerScreamer);
  </script>
